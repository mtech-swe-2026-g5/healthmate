name: Dependabot
on:
  pull_request:
    branches:
      - dependabot/**

permissions:
  pull-requests: write
  contents: write
  checks: write
  id-token: write
  actions: read

jobs:
  build:
    name: Validate Dependabot Changes
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]'}}
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healthmate?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm db:check
      - run: pnpm lint
      - run: pnpm test
      - uses: ./.github/actions/upload-test-report
      - run: pnpm build
  merge:
    name: Auto Merge
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]'}}
    steps:
      - uses: actions/checkout@v6
      - run: gh pr merge --squash ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
