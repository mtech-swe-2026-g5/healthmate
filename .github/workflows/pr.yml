name: PR Checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/pnpm-setup
      - run: pnpm lint
      - run: pnpm test
      - uses: ./.github/workflows/composite/upload-test-report
      - run: pnpm build
  semantic-release:
    name: Semantic Release Dry Run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/workflows/composite/release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
