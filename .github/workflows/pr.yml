name: PR Checks
on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: PR Checks
    runs-on: ubuntu-latest
    env:
      # Used by prisma.config.ts, prisma generate, and build (no live DB required).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healthmate?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-setup
      - run: pnpm db:check
      - run: pnpm lint
      - run: pnpm test
      - uses: ./.github/actions/upload-test-report
      - run: pnpm build
