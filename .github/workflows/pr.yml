name: PR Checks
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/pnpm-setup
      - run: pnpm test
      - uses: ./.github/workflows/composite/upload-test-report
      - run: pnpm build
