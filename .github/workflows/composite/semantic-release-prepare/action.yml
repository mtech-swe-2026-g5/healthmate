name: Semantic Release Prepare
description: Prepare environment for Semantic Release (checkout, token, git config)
inputs:
  app-id:
    description: GitHub App ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
outputs:
  token:
    description: GitHub token for authentication
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Create GitHub App Token
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
    - name: Configure git author
      run: |
        git config user.name "bits-semantic-release-bot[bot]"
        git config user.email "bits-semantic-release-bot[bot]@users.noreply.github.com"
      shell: bash

