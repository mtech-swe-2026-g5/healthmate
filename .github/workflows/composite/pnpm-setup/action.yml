name: Setup pnpm and install dependencies
description: Set up Node.js, pnpm and install dependencies
inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
        cache: true
    - name: Install Dependencies
      shell: bash
      env:
        # Prisma 7 loads prisma.config.ts on postinstall (prisma generate).
        # A placeholder URL is enough — generate does not connect to the DB.
        DATABASE_URL: postgresql://ci:ci@localhost:5432/healthmate?sslmode=disable
      run: pnpm install

