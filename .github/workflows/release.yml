name: release.yml
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency: semantic-release
jobs:
  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest
    env:
      # Used by prisma.config.ts, prisma generate, and build (no live DB required).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/healthmate?sslmode=disable
    permissions:
      contents: read
      checks: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-checks
  semantic-release-dry-run:
    name: Semantic Release Dry Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: ./.github/actions/semantic-release-prepare
        id: prepare
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/actions/release
        with:
          github_token: ${{ steps.prepare.outputs.token }}
  semantic-release:
    name: Semantic Release
    needs: [ release-checks, semantic-release-dry-run ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: ./.github/actions/semantic-release-prepare
        id: prepare
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/actions/release
        id: semantic_release
        with:
          dry_run: false
          github_token: ${{ steps.prepare.outputs.token }}
  deploy:
    name: Deploy to Vercel
    needs: [ semantic-release ]
    runs-on: ubuntu-latest
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
