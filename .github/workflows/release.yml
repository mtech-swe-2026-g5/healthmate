name: release.yml
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency: semantic-release
jobs:
  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/composite/pnpm-setup
      - run: pnpm lint
      - run: pnpm test
      - uses: ./.github/workflows/composite/upload-test-report
      - run: pnpm build
  semantic-release:
    name: Semantic Release
    needs: [ release-checks ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic_release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/workflows/composite/release
        with:
          dry_run: false
          github_token: ${{ steps.app-token.outputs.token }}
  deploy:
    name: Deploy to Vercel
    needs: [ semantic-release ]
    runs-on: ubuntu-latest
    if: ${{ needs.semantic-release.outputs.new_release_published == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
      - uses: ./.github/workflows/composite/deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
