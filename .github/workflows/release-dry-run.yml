name: Semantic Release Dry Run
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  semantic-release:
    name: Semantic Release Dry Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - uses: ./.github/workflows/composite/semantic-release-prepare
        id: prepare
        with:
          app-id: ${{ vars.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_PRIVATE_KEY }}
      - uses: ./.github/workflows/composite/release
        with:
          github_token: ${{ steps.prepare.outputs.token }}
